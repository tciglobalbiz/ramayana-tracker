name: Ramayana tracker

on:
  schedule:
    # UTC. Every 3 hours at :17 (IST 05:47, 08:47, 11:47 ... 02:47)
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: ramayana-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false        # one city failing never stops the others
      matrix:
        city:
          - mumbai
          - national-capital-region-ncr
          - bengaluru
          - hyderabad
          - pune
          - kolkata
          - chennai
          - ahmedabad
    name: ${{ matrix.city }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Run tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CITIES: ${{ matrix.city }}
          MAX_SHOWS: "25"
          HEADLESS: "false"
        run: xvfb-run --auto-servernum python tracker.py

      - name: Save screenshots of any blocked pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.city }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
