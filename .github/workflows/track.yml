name: Ramayana tracker

on:
  # AUTOMATIC TRACKING IS OFF. To switch it on (e.g. when the website goes live),
  # remove the "# " from the two lines below. Each hourly run then keeps going ~50 min,
  # doing a pass every 15 min (opening-weekend dates every 15 min, later dates hourly).
  # schedule:
  #   - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes to keep tracking (0 = one full pass, 50 = like the hourly run)"
        default: "0"

concurrency:
  group: ramayana-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Run District tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '50' || inputs.loop_minutes || '0' }}
          INTERVAL_MINUTES: "15"
          FAR_EVERY_MINUTES: "60"
          PARALLEL: "8"
          HEADLESS: "false"
          PYTHONUNBUFFERED: "1"
        run: xvfb-run --auto-servernum python district_tracker.py
