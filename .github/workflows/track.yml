name: Ramayana tracker

on:
  schedule:
    # UTC. Starts every hour at :07; each run keeps going ~50 min, doing a pass every 15 min.
    # Opening-weekend dates every 15 min, later dates once an hour, all cities re-checked twice a day.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: ramayana-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Run District tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          LOOP_MINUTES: "50"
          INTERVAL_MINUTES: "15"
          FAR_EVERY_MINUTES: "60"
          HEADLESS: "false"
          PYTHONUNBUFFERED: "1"
        run: xvfb-run --auto-servernum python district_tracker.py
